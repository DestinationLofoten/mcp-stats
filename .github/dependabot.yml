version: 2
updates:
  # ---- npm dependencies ----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Roll every minor/patch version bump into ONE PR
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Roll every minor/patch security fix into ONE PR
      npm-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
    # Major bumps are intentionally left ungrouped so they arrive as
    # individual PRs you review by hand.

  # ---- GitHub Actions used in workflows ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
